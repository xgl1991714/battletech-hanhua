[package]
name = "battletech-hanhua"
version = "1.0.1"
description = "BATTLETECH 汉化工具（Tauri + Rust 复刻版）"
authors = ["MoonStone"]
edition = "2021"
rust-version = "1.93"

# The `_lib` suffix avoids a name conflict between the library and the binary on Windows.
[lib]
name = "battletech_hanhua_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "wry"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "rt", "time"] }
futures-util = "0.3"
md-5 = "0.10"
hex = "0.4"
flate2 = "1"
regex = "1"
filetime = "0.2"
walkdir = "2"
chrono = "0.4"
urlencoding = "2"
sevenz-rust2 = "0.24"
unityfs = "0.1.4"
png = "0.17"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
